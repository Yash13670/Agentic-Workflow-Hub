openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Autonomous Enterprise Workflow Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workflow
    description: Workflow engine operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workflow/run:
    post:
      operationId: runWorkflow
      tags: [workflow]
      summary: Run the full autonomous workflow pipeline
      description: Accepts meeting notes and runs all 7 agents sequentially
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "200":
          description: Workflow completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WorkflowInput:
      type: object
      properties:
        meetingNotes:
          type: string
          description: Raw meeting notes to process
      required:
        - meetingNotes
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, medium, low]
        priorityScore:
          type: number
        assignedTo:
          type: string
        deadline:
          type: string
        status:
          type: string
          enum: [pending, in_progress, delayed, completed, escalated, reassigned]
        slaHours:
          type: number
        isDelayed:
          type: boolean
        actionTaken:
          type: string
      required:
        - id
        - title
        - description
        - priority
        - priorityScore
        - assignedTo
        - deadline
        - status
        - slaHours
        - isDelayed
        - actionTaken
    Alert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [sla_breach, bottleneck, escalation, reassignment]
        taskId:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        timestamp:
          type: string
      required:
        - id
        - type
        - taskId
        - message
        - severity
        - timestamp
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        agent:
          type: string
        action:
          type: string
        taskId:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        timestamp:
          type: string
        modelUsed:
          type: string
      required:
        - id
        - agent
        - action
        - taskId
        - timestamp
        - modelUsed
    ImpactMetrics:
      type: object
      properties:
        timeSavedHours:
          type: number
        manualEffortReduced:
          type: number
        slaBrechesAvoided:
          type: number
        tasksAutoReassigned:
          type: number
        tasksEscalated:
          type: number
        totalTasksProcessed:
          type: number
      required:
        - timeSavedHours
        - manualEffortReduced
        - slaBrechesAvoided
        - tasksAutoReassigned
        - tasksEscalated
        - totalTasksProcessed
    WorkflowResult:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        audit_trail:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        model_used:
          type: string
          enum: [lightweight, advanced]
        impact:
          $ref: "#/components/schemas/ImpactMetrics"
      required:
        - tasks
        - alerts
        - audit_trail
        - model_used
        - impact
